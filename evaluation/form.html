<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Required Information</title>
</head>

<body>
    <form action="/" method="post">
        <h1>Donor Information</h1>
        <table>
            <tr>
                <td><label for="first-name"> First Name* </label></td>
                <td><input type="text" id="first-name" name="first-name" required></td>
            </tr>
            <tr>
                <td><label for="last-name"> Last Name* </label></td>
                <td><input type="text" id="last-name" name="last-name" required></td>
            </tr>
            <tr>
                <td><label for="company"> Company </label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
            <tr>
                <td><label for="address1"> Address 1* </label></td>
                <td><input type="number" id="address1" name="address1" required></td>
            </tr>
            <tr>
                <td><label for="address2"> Address 2 </label></td>
                <td><input type="number" id="address2" name="address2"></td>
            </tr>
            <tr>
                <td><label for="city"> City*</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="state"> State* </label></td>
                <td>
                    <select name="state" id="state">
                        <option value="null"> - Select a State - </option>
                        <option value=""></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zip-code"> Zip Code* </label></td>
                <td><input type="number" id="zip-code" name="zip-code"></td>
            </tr>
            <tr>
                <td><label for="country"> Country* </label></td>
                <td>
                    <select name="country" id="country">
                        <option value="null"> - Select a Country - </option>
                        <option value="bangladesh"> Bangladesh</option>
                        <option value="usa"> USA </option>
                        <option value="uk"> UK </option>
                    </select>

                </td>
            </tr>
            <tr>
                <td><label for="phone"> Phone </label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>
            <tr>
                <td><label for="fax"> Fax </label></td>
                <td><input type="tel" id="fax" name="fax"></td>
            </tr>
            <tr>
                <td><label for="email"> Email* </label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td>
                    <label for="donation-amount"> Donation Amount* </label>
                    <p>(Check a button or type in your amount)</p>
                </td>
                <td>
                    <input type="radio" id="none" name="donation-amount" value="none">
                    <label for="none"> None </label>
                    <input type="radio" id="50" name="donation-amount" value="50">
                    <label for="50"> $50 </label>
                    <input type="radio" id="75" name="donation-amount" value="75">
                    <label for="75"> $75 </label>
                    <input type="radio" id="100" name="donation-amount" value="100">
                    <label for="100"> $100 </label>
                    <input type="radio" id="250" name="donation-amount" value="250">
                    <label for="250"> $250 </label>
                    <input type="radio" id="other" name="donation-amount" value="other">
                    <label for="other"> Other </label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="other-amount"> Other Amount $ </label>
                    <input type="number" id="other-amount" name="other-amount">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="recurring-donation"> Recurring Donation
                        <p>(Check if yes)</p>
                    </label>
                </td>
                <td>
                    <input type="checkbox" id="recurring-donation" name="recurring-donation" value="yes">
                    <label for="recurring-donation"> I am interested in giving on a regular basis </label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="monthly-credit-card"> Monthly Credit Card $ <input type="number"> For <input
                            type="number"> Months </label>

                </td>
            </tr>


        </table>

    </form>

</body>

</html>
